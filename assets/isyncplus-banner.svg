<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" role="img" aria-labelledby="title desc">
  <title id="title">iSyncPlus — interfaces in motion</title>
  <desc id="desc">An animated constellation of connected nodes representing ideas becoming products.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#091316"/>
      <stop offset="0.52" stop-color="#122b2d"/>
      <stop offset="1" stop-color="#201b28"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#91c9ba" stop-opacity="0"/>
      <stop offset="0.48" stop-color="#91c9ba" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#e8b86d" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop stop-color="#91c9ba" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#91c9ba" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#d5fff2" stroke-opacity="0.06"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="4"/></filter>
    <style>
      .orbit { transform-box: fill-box; transform-origin: center; animation: spin 18s linear infinite; }
      .orbit-slow { transform-box: fill-box; transform-origin: center; animation: spin-reverse 28s linear infinite; }
      .pulse { animation: pulse 2.8s ease-in-out infinite; }
      .dash { stroke-dasharray: 8 18; animation: dash 7s linear infinite; }
      .float { animation: float 5s ease-in-out infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes spin-reverse { to { transform: rotate(-360deg); } }
      @keyframes pulse { 0%,100% { opacity: .35; transform: scale(.88); } 50% { opacity: 1; transform: scale(1.08); } }
      @keyframes dash { to { stroke-dashoffset: -104; } }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
      @media (prefers-reduced-motion: reduce) { .orbit,.orbit-slow,.pulse,.dash,.float { animation: none; } }
    </style>
  </defs>
  <rect width="1600" height="420" rx="24" fill="url(#bg)"/>
  <rect width="1600" height="420" rx="24" fill="url(#grid)"/>
  <circle cx="1220" cy="150" r="240" fill="url(#glow)" filter="url(#blur)"/>
  <circle cx="420" cy="360" r="180" fill="#e8b86d" opacity="0.08" filter="url(#blur)"/>
  <g opacity="0.8">
    <path d="M0 316C252 258 414 391 686 316S1118 212 1600 292" fill="none" stroke="url(#line)" stroke-width="2"/>
    <path d="M0 338C262 276 428 409 704 337S1150 236 1600 314" fill="none" stroke="#91c9ba" stroke-opacity="0.14" stroke-width="1" class="dash"/>
  </g>
  <g transform="translate(1190 210)">
    <circle r="108" fill="none" stroke="#91c9ba" stroke-opacity="0.17" stroke-width="1" stroke-dasharray="2 13" class="orbit"/>
    <circle r="72" fill="none" stroke="#e8b86d" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="3 9" class="orbit-slow"/>
    <circle r="16" fill="#91c9ba" opacity="0.18" filter="url(#soft)" class="pulse"/>
    <circle r="5" fill="#d5fff2"/>
    <g class="orbit"><circle cx="108" r="6" fill="#e8b86d"/><circle cx="-108" r="4" fill="#91c9ba"/></g>
    <g class="orbit-slow"><circle cy="72" r="5" fill="#d5fff2"/><circle cy="-72" r="3" fill="#e8b86d"/></g>
  </g>
  <g class="float">
    <path d="M860 115l176 83-176 83-176-83z" fill="none" stroke="#91c9ba" stroke-opacity="0.28"/>
    <path d="M860 115v166M684 198h352" stroke="#91c9ba" stroke-opacity="0.13"/>
    <circle cx="860" cy="198" r="9" fill="#e8b86d"/>
    <circle cx="684" cy="198" r="5" fill="#91c9ba"/>
    <circle cx="1036" cy="198" r="5" fill="#91c9ba"/>
  </g>
  <g fill="#d5fff2">
    <circle cx="146" cy="104" r="2" opacity="0.7"/><circle cx="260" cy="286" r="3" opacity="0.45"/><circle cx="1380" cy="82" r="2" opacity="0.55"/><circle cx="1500" cy="250" r="3" opacity="0.38"/>
  </g>
  <g transform="translate(104 116)">
    <text fill="#91c9ba" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" letter-spacing="4">DESIGN · SYSTEMS · MOTION</text>
    <text y="92" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="76" font-weight="800" letter-spacing="-3">iSyncPlus</text>
    <text y="135" fill="#c7d8d5" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22">Turning rough ideas into products people remember.</text>
    <path d="M0 170h270" stroke="#e8b86d" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
